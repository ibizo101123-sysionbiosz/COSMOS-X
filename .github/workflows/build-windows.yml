name: Build COSMOS X for Windows
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        run: cmake --build build --config Release --target COSMOSX_VST3 --parallel
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" installer/COSMOS_X.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/COSMOS_X_Installer.exe package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath COSMOS_X_COMPLETE.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: COSMOS_X_COMPLETE
          path: COSMOS_X_COMPLETE.zip
          if-no-files-found: error