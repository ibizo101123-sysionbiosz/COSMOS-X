name: COSMOS X Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64 build
        shell: pwsh
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Verify VST3 bundle
        shell: pwsh
        run: |
          $plugin = Join-Path $PWD "build/COSMOSX_artefacts/Release/VST3/COSMOS X.vst3"
          if (!(Test-Path $plugin -PathType Container)) { throw "VST3 bundle missing: $plugin" }
          $module = Get-ChildItem $plugin -Recurse -Filter "*.vst3" | Select-Object -First 1
          if (!$module) { throw "VST3 module binary not found in bundle." }
          Get-ChildItem $plugin -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "installer/COSMOS_X.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "dist/COSMOS_X_Installer.exe")) { throw "Installer EXE was not produced." }

      - name: Package deliverable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "dist/COSMOS_X_Installer.exe" "package/"
          Copy-Item "README.md" "package/INSTALL_HE.md"
          Compress-Archive -Path "package/*" -DestinationPath "COSMOS_X_COMPLETE.zip" -Force
          if (!(Test-Path "COSMOS_X_COMPLETE.zip")) { throw "ZIP package was not produced." }

      - name: Upload Windows deliverable
        uses: actions/upload-artifact@v4
        with:
          name: COSMOS_X_COMPLETE
          path: COSMOS_X_COMPLETE.zip
          if-no-files-found: error
          retention-days: 30
